<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Зuploading files and working with text</title>
</head>
<body>
    <h2>Uploading a file to the server</h2>
    <form action="process.php" method="post" enctype="multipart/form-data">
        <label for="file">Select a file (jpg, jpeg, png, no more than 2 MB):</label><br>
        <input type="file" name="file" id="file" required><br><br>
        <input type="submit" value="download file">
    </form>

    <hr>

    <h2>Writing text to a file log.txt</h2>
    <form action="text.php" method="post">
        <textarea name="content" rows="5" cols="40" placeholder="Enter text" required></textarea><br><br>
        <input type="submit" value="Record text">
    </form>

    <hr>

    <h2>View list of downloaded files</h2>
    <a href="list.php">Open file list</a>
</body>
</html>
